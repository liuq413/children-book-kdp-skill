<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">KDP readiness checklist</title>
  <desc id="desc">A visual checklist for reviewing a children's picture book before Amazon KDP upload.</desc>
  <defs>
    <style>
      .h{font:700 44px Arial, sans-serif;fill:#0F172A}
      .s{font:400 21px Arial, sans-serif;fill:#475569}
      .t{font:700 24px Arial, sans-serif;fill:#111827}
      .b{font:400 18px Arial, sans-serif;fill:#64748B}
      .check{font:700 22px Arial, sans-serif;fill:#166534}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#F0FDF4"/>
  <text class="h" x="72" y="78">KDP Readiness: What the Skill Checks</text>
  <text class="s" x="74" y="116">A children's book is not ready just because the story is finished.</text>
  <g transform="translate(90 170)" filter="url(#shadow)">
    <rect width="320" height="430" rx="26" fill="#FFFFFF"/>
    <text class="t" x="34" y="52">Story quality</text>
    <text class="check" x="36" y="105">✓</text><text class="b" x="72" y="105">Age-fit vocabulary</text>
    <text class="check" x="36" y="155">✓</text><text class="b" x="72" y="155">Lesson shown in action</text>
    <text class="check" x="36" y="205">✓</text><text class="b" x="72" y="205">Clear visual moment per page</text>
    <text class="check" x="36" y="255">✓</text><text class="b" x="72" y="255">Read-aloud rhythm</text>
    <text class="check" x="36" y="305">✓</text><text class="b" x="72" y="305">Parent-facing benefit</text>
  </g>
  <g transform="translate(480 170)" filter="url(#shadow)">
    <rect width="320" height="430" rx="26" fill="#FFFFFF"/>
    <text class="t" x="34" y="52">Visual consistency</text>
    <text class="check" x="36" y="105">✓</text><text class="b" x="72" y="105">Character anchor repeated</text>
    <text class="check" x="36" y="155">✓</text><text class="b" x="72" y="155">No protected IP copying</text>
    <text class="check" x="36" y="205">✓</text><text class="b" x="72" y="205">Broad art style language</text>
    <text class="check" x="36" y="255">✓</text><text class="b" x="72" y="255">Cover reads at thumbnail size</text>
    <text class="check" x="36" y="305">✓</text><text class="b" x="72" y="305">Text does not fight images</text>
  </g>
  <g transform="translate(870 170)" filter="url(#shadow)">
    <rect width="320" height="430" rx="26" fill="#FFFFFF"/>
    <text class="t" x="34" y="52">Print + listing</text>
    <text class="check" x="36" y="105">✓</text><text class="b" x="72" y="105">Trim size selected</text>
    <text class="check" x="36" y="155">✓</text><text class="b" x="72" y="155">Bleed and safe margins checked</text>
    <text class="check" x="36" y="205">✓</text><text class="b" x="72" y="205">Cover, back, spine considered</text>
    <text class="check" x="36" y="255">✓</text><text class="b" x="72" y="255">Keywords match buyer intent</text>
    <text class="check" x="36" y="305">✓</text><text class="b" x="72" y="305">PDF export is print-ready</text>
  </g>
  <rect x="260" y="652" width="760" height="48" rx="24" fill="#DCFCE7"/>
  <text class="s" x="310" y="683">Use the audit step before upload, proof copies, or paid promotion.</text>
</svg>
