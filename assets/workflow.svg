<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">12-step children's book KDP workflow</title>
  <desc id="desc">A visual map of the twelve-step workflow from idea generation to print-ready KDP checks.</desc>
  <defs>
    <style>
      .h{font:700 42px Arial, sans-serif;fill:#111827}
      .s{font:400 21px Arial, sans-serif;fill:#475569}
      .n{font:700 22px Arial, sans-serif;fill:white}
      .t{font:700 23px Arial, sans-serif;fill:#111827}
      .d{font:400 17px Arial, sans-serif;fill:#64748B}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="820" fill="#F8FAFC"/>
  <text class="h" x="70" y="76">12-Step Picture Book to KDP Workflow</text>
  <text class="s" x="72" y="112">Use the skill end-to-end, or run only the step you need.</text>
  <g transform="translate(70 164)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#F97316"/><text class="n" x="38" y="50">1</text>
      <text class="t" x="78" y="44">Idea generator</text><text class="d" x="28" y="84">titles, characters, parent appeal</text>
    </g>
    <g transform="translate(290 0)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#2563EB"/><text class="n" x="38" y="50">2</text>
      <text class="t" x="78" y="44">Story structure</text><text class="d" x="28" y="84">page beats and visual moments</text>
    </g>
    <g transform="translate(580 0)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#16A34A"/><text class="n" x="38" y="50">3</text>
      <text class="t" x="78" y="44">Manuscript</text><text class="d" x="28" y="84">age-fit read-aloud text</text>
    </g>
    <g transform="translate(870 0)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#9333EA"/><text class="n" x="38" y="50">4</text>
      <text class="t" x="78" y="44">Character sheet</text><text class="d" x="28" y="84">consistency anchor for art</text>
    </g>
    <g transform="translate(0 154)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#F97316"/><text class="n" x="38" y="50">5</text>
      <text class="t" x="78" y="44">Illustration prompts</text><text class="d" x="28" y="84">one prompt per page</text>
    </g>
    <g transform="translate(290 154)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#2563EB"/><text class="n" x="38" y="50">6</text>
      <text class="t" x="78" y="44">Cover prompt</text><text class="d" x="28" y="84">thumbnail-ready cover</text>
    </g>
    <g transform="translate(580 154)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#16A34A"/><text class="n" x="38" y="50">7</text>
      <text class="t" x="78" y="44">KDP description</text><text class="d" x="28" y="84">parent-benefit listing copy</text>
    </g>
    <g transform="translate(870 154)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#9333EA"/><text class="n" x="38" y="50">8</text>
      <text class="t" x="78" y="44">Series plan</text><text class="d" x="28" y="84">repeatable book brand</text>
    </g>
    <g transform="translate(0 308)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#F97316"/><text class="n" x="38" y="50">9</text>
      <text class="t" x="78" y="44">Layout plan</text><text class="d" x="28" y="84">Canva or Book Brush guidance</text>
    </g>
    <g transform="translate(290 308)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#2563EB"/><text class="n" x="33" y="50">10</text>
      <text class="t" x="78" y="44">Originality review</text><text class="d" x="28" y="84">IP, brand, and style risks</text>
    </g>
    <g transform="translate(580 308)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#16A34A"/><text class="n" x="35" y="50">11</text>
      <text class="t" x="78" y="44">Keywords</text><text class="d" x="28" y="84">categories and search intent</text>
    </g>
    <g transform="translate(870 308)" filter="url(#shadow)">
      <rect width="270" height="130" rx="18" fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="20" fill="#9333EA"/><text class="n" x="33" y="50">12</text>
      <text class="t" x="78" y="44">Print checks</text><text class="d" x="28" y="84">trim, bleed, safe margins</text>
    </g>
  </g>
  <path d="M160 682h960" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <text class="s" x="282" y="735">Idea</text>
  <text class="s" x="498" y="735">Story</text>
  <text class="s" x="718" y="735">Assets</text>
  <text class="s" x="928" y="735">KDP-ready</text>
</svg>
