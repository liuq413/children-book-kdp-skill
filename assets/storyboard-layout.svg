<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Storyboard to layout example</title>
  <desc id="desc">A visual example showing how a manuscript page becomes a storyboard row, an illustration prompt, and a Canva layout plan.</desc>
  <defs>
    <style>
      .h{font:700 42px Arial, sans-serif;fill:#0F172A}
      .s{font:400 21px Arial, sans-serif;fill:#475569}
      .t{font:700 23px Arial, sans-serif;fill:#111827}
      .b{font:400 17px Arial, sans-serif;fill:#64748B}
      .n{font:700 18px Arial, sans-serif;fill:white}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#EFF6FF"/>
  <text class="h" x="72" y="76">From Manuscript To Page Layout</text>
  <text class="s" x="74" y="112">The workbench turns each page into a storyboard row, image prompt, and layout instruction.</text>
  <g transform="translate(72 170)" filter="url(#shadow)">
    <rect width="260" height="430" rx="24" fill="#FFFFFF"/>
    <circle cx="42" cy="42" r="18" fill="#2563EB"/><text class="n" x="37" y="49">1</text>
    <text class="t" x="74" y="49">Manuscript</text>
    <path d="M42 104h170M42 140h145M42 176h180M42 212h128" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>
    <rect x="42" y="278" width="176" height="96" rx="18" fill="#DBEAFE"/>
    <text class="b" x="62" y="319">page text</text>
    <text class="b" x="62" y="350">visual moment</text>
  </g>
  <path d="M365 386h80" stroke="#F97316" stroke-width="10" stroke-linecap="round"/>
  <path d="M430 358l44 28-44 28" fill="none" stroke="#F97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(500 170)" filter="url(#shadow)">
    <rect width="300" height="430" rx="24" fill="#FFFFFF"/>
    <circle cx="42" cy="42" r="18" fill="#16A34A"/><text class="n" x="37" y="49">2</text>
    <text class="t" x="74" y="49">Storyboard row</text>
    <rect x="36" y="94" width="228" height="54" rx="14" fill="#DCFCE7"/>
    <text class="b" x="58" y="127">scene action</text>
    <rect x="36" y="168" width="228" height="54" rx="14" fill="#FEF3C7"/>
    <text class="b" x="58" y="201">character + emotion</text>
    <rect x="36" y="242" width="228" height="54" rx="14" fill="#FCE7F3"/>
    <text class="b" x="58" y="275">composition</text>
    <rect x="36" y="316" width="228" height="54" rx="14" fill="#EDE9FE"/>
    <text class="b" x="58" y="349">props + continuity</text>
  </g>
  <path d="M832 386h80" stroke="#F97316" stroke-width="10" stroke-linecap="round"/>
  <path d="M897 358l44 28-44 28" fill="none" stroke="#F97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(968 170)" filter="url(#shadow)">
    <rect width="240" height="430" rx="24" fill="#FFFFFF"/>
    <circle cx="42" cy="42" r="18" fill="#9333EA"/><text class="n" x="37" y="49">3</text>
    <text class="t" x="74" y="49">Layout</text>
    <rect x="42" y="94" width="156" height="218" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="5"/>
    <rect x="58" y="112" width="124" height="116" rx="12" fill="#BFDBFE"/>
    <path d="M62 254h112M62 280h92" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
    <rect x="42" y="342" width="156" height="48" rx="16" fill="#EDE9FE"/>
    <text class="b" x="66" y="373">safe text zone</text>
  </g>
</svg>
